name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/test_unit.py -sv

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start server in background
        run: nohup uvicorn api.app:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &

      - name: Wait for server to be ready
        run: sleep 15

      - name: Run E2E tests
        run: pytest tests/test_e2e.py -sv

  build-and-push:
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/password-api:latest .

      - name: Push de l'image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/password-api:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/password-api:latest
            docker stop myapp || true
            docker rm myapp || true
            docker run -d --name myapp -p 8080:8000 ${{ secrets.DOCKERHUB_USERNAME }}/password-api:latest
            curl http://localhost:8080/health